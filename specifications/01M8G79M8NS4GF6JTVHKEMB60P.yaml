id: 01M8G79M8NS4GF6JTVHKEMB60P
title: "Open Lexis Transcription Specification: Decoupled Severity & Granular Alignment"
author: Open Lexis
license:
  copyright: Copyright 2026 Open Lexis
  name: CC BY-NC 4.0
  url: https://creativecommons.org/licenses/by-nc/4.0/
summary: Obtain transcriptions of the 66 books of the Bible by recovering the original text of
  each from the pinned primary manuscript transcriptions, evaluating mechanical edit type,
  substantive meaning impact, and statistical originality probability as three independent axes
  with granular word-level alignment.
objective:
  mission: Recover the original text of each biblical book as originally written, in its original
    language, by its original author.
  scope:
    - Both the target books to reconstruct and the exact primary witnesses permitted for each book
      are defined in one place under `sources`.
    - The `sources` field at the end of this file lists every permitted transcript, one line each,
      with its repository path and the git commit that holds it.
evidence:
  allowlist_rule: A compilation under this specification operates on a strict allowlist. It may read
    only this file and the XML transcripts listed under `sources` at the end of this file, each read
    at the git commit recorded for it. A compiler must not roam `archives/` or ingest any unreferenced
    file.
  metadata_fields:
    - name: Dating
      description: Date range, margin of error, and dating method (e.g., radiocarbon dating, paleography,
        colophon).
    - name: Provenance
      description: Place of origin or writing.
    - name: Scientific analysis
      description: Any physical or scientific dating results.
    - name: Physical and scribal evidence
      description: Manuscript condition, scribal corrections, and transcription/copying errors.
    - name: Textual agreement
      description: Patterns of agreement and disagreement across the listed manuscripts.
  unknowns: If a metadata field is not documented for a source in its catalog at the recorded commit, it must
    remain unknown. Unknown facts must never be invented, guessed, or backfilled.
  exclusion_rule: Everything not explicitly included in this specification is excluded and must be
    ignored. This total exclusion covers all outside material, including, without limitation, printed
    or critical editions, translations into other languages, modern textual reconstructions,
    manuscript images (facsimiles), external scholarly commentary, and any unreferenced files.
corpus_layout:
  root: archives
  structure: All manuscript transcriptions reside under `archives/<archive>/`. The `sources` list at
    the end of this file lists each transcript this specification uses with its path and the git
    commit that holds it, so later changes to `archives/` do not change what this specification
    includes.
  naming:
    sources: specifications/<ULID>.yaml (the `sources` list at the end of this file)
    single_file: archives/<archive>/{source}.xml
    multi_file: archives/<archive>/{source}.{part}.xml
  formats:
    - name: Source TEI XML
      description: Stored verbatim, unchanged from the source publication.
    - name: Source non-TEI XML
      description: Stored verbatim, unchanged, with its format documented in the catalog at the recorded commit.
    - name: Non-XML sources
      description: When a source institution does not publish XML, the transcription is encoded as TEI P5
        XML and documented as such in the catalog at the recorded commit.
statistical_modeling:
  mission_principle: "The sole mission of this work is to recover the original text as originally
    written, in its original language, by its original author. Modeling decisions should be judged
    by a single standard: anything that furthers recovery of the original text is good, and anything
    that detracts from it is bad."
  rationale: Surviving manuscripts frequently disagree and vary widely in age, provenance,
    preservation, and scribal accuracy. Simple majority voting should not be used. Instead, a
    compilation should apply an explicit statistical model to the permitted evidence to estimate,
    for each reading (the text attested by a manuscript at a given point, including an omission),
    both its probability of originality and an uncertainty interval.
  uncertainty_guidance:
    - Sparse, conflicting, or poorly documented evidence, including unknown metadata, should widen the
      uncertainty interval.
    - Consistent agreement among early, independent witnesses should narrow it.
    - Unknown metadata should remain unknown and widen uncertainty rather than being imputed.
  source_assessment:
    - name: Factors that may lower credibility
      description: Frequent misspellings, copying errors, cross-throughs, heavy edits or later
        corrections, self-contradictions, internal inconsistencies, and other indicators of careless
        or unstable transmission should be weighed as potentially weakening a source's reliability.
    - name: Factors that may strengthen credibility
      description: Conversely, clean and disciplined copying, low error rates, internal consistency, early
        dating, and independent agreement with other strong witnesses should be weighed as
        strengthening a source's reliability.
    - name: Physical deterioration and antiquity
      description: Physical damage (such as tattered parchment, lacunae, or missing words in ancient
        sources like the Dead Sea Scrolls) should not count against a manuscript's credibility.
        Genuine deterioration consistent with antiquity can instead reinforce a witness's
        authenticity and early provenance, even though missing words themselves leave local
        uncertainty where text is absent.
    - name: Filled-in text for lost portions
      description: Where a transcription fills in text for lost portions of a manuscript, that filled-in
        text is marked as such and given weight accordingly.
    - name: Independence of edit category, substantive severity, and statistical weight
      description: >-
        Models should treat three properties of every variant reading as independent axes rather
        than hard-wiring one to another: (1) the mechanical/structural edit category (what changed
        in the text: spelling slip, phonetic confusion, particle/article omission or addition,
        grammatical inflection, word order, lexical substitution, or phrase omission/addition);
        (2) substantive severity (how materially the variant alters meaning, narrative, grammar, or
        authorial intent on the model's chosen scale); and (3) statistical weight (the posterior
        probability that the reading is original). Illustrative examples: omitting a routine
        conjunction such as Greek `δε` in a genealogy is a structural omission yet carries minimal
        substantive impact; a single-letter vowel shift such as `εχομεν` ("we have") vs. `εχωμεν`
        ("let us have") is mechanically tiny yet changes mood and meaning; and visually or
        phonetically similar ordinal words such as Hebrew `השביעי` ("the seventh") vs. `הששי`
        ("the sixth") in Genesis 2:2 share surface form yet represent a substantive factual
        difference with real statistical weight.
    - name: Granular word-level alignment
      description: >-
        Where feasible, align witnesses so individual word-level variants and inter-word
        insertions or omissions are represented as localized apparatus units rather than merging an
        entire verse or sentence into a single `<app>` when a minority witness drops or adds a word
        alongside unrelated minor spelling differences elsewhere in the line.
  model_freedom: This specification does not prescribe a specific statistical model, severity
    rubric, or taxonomy; any defensible model that advances recovery of the original text may be
    used, provided its choices are clearly documented in the output and conform to the output
    contract in `AGENTS.md`.
  information_to_consider:
    framing: >-
      When interpreting differences between manuscripts and resolving disagreements,
      consider the questions below. This specification does not assert answers to them.
      The model decides each one from the evidence.
    questions:
      - Did the speaker speak the language that was written?
      - Is the speaker familiar with the language that was written?
      - Is the author a native speaker of the language?
      - Is the author a native writer of the language?
      - Is the author well trained in the language they are writing in?
      - Does a disputed word match the author's level of skill in the language?
      - Does a disputed word fit the context?
      - Is a word or phrase quoted, translated, or transliterated from another language
        or another text, and which wording would that source have used?
      - Does a reading match the author's usual style elsewhere?
    principle: >-
      A reading is more credible when it fits the author's own way of writing. A more
      practiced writer may write with more polish, and a less practiced one may write
      more simply or with distinctive habits. The model judges that way of writing from
      the evidence, and should treat a reading that stays in character as more credible
      than one that does not.
output_requirements:
  - name: Compiled text
    description: The selected original-language text for every book represented by `sources`, organized
      by book and numbered reference (`chapter:line`).
  - name: Word-level witness coverage
    description: For every word in the compiled text, which manuscripts attest it, which attest a
      different reading (and what that reading is), and which are lacunose or unreadable at that
      point.
  - name: Variant apparatus with decoupled severity and edit category
    description: >-
      For every point of disagreement (any span within a line where surviving witnesses do not all
      agree), every attested reading, its supporting manuscripts, how the readings mechanically
      differ (`<note type="difference">`), and an independent substantive-severity annotation
      (`<note type="severity" n="<level>" subtype="<subcategory-id>">`) referencing a subcategory
      declared in `REPORT.md`. Models must evaluate substantive impact on meaning/authorial intent
      independently of the mechanical edit category and independently of the reading's statistical
      weight. The specification does not prescribe which subcategories, numeric scale, or
      statistical weighting a model must use; it requires only the conforming data structure so
      downstream tools can parse and display the model's choices.
  - name: Probabilities and uncertainty
    description: For every reading, the model's estimated probability of originality and its uncertainty
      interval.
  - name: Manuscript evidence record
    description: The documented metadata used for each manuscript (date range, dating method, and all
      other fields under `evidence`), explicitly noting which fields were unknown.
  - name: Method description and structured compilation report
    description: >-
      A clear, plain-language Markdown report (`REPORT.md`) with structured YAML
      frontmatter conforming to the parseable schema documented in `AGENTS.md` and `README.md`:
      `specification_id`, `compilation_id`, `created_at`, `model_attribution`, `method_summary`,
      `disagreement_scale` (`min`, `max`, `description`), `disagreement_categories` (`id`, `label`,
      `description`, `count`), `disagreement_subcategories` (`id`, `label`, `level`, `level_label`,
      `description`, `local_confidence_effect`, `corpus_authenticity_effect`, `count`),
      `authenticity_signal`, `evidence_usage`, and `totals`.
  - name: Model attribution
    description: Complete, maximally detailed identification of the system or model that made the
      non-deterministic judgments (selecting readings and estimating probabilities), including lab or
      provider, model family and exact name, exact version or release snapshot, variant or tier,
      reasoning or effort level, and any other relevant runtime or inference settings (such as
      temperature, thinking budget, or harness). Purely deterministic utilities that only copy,
      parse, or format data are not required to identify themselves.
  - name: Specification reference
    description: An explicit statement that the compilation was produced under this specification,
      citing its ID (`01M8G79M8NS4GF6JTVHKEMB60P`).
output_format:
  standard: TEI P5 XML
  references:
    critical_apparatus: https://tei-c.org/release/doc/tei-p5-doc/en/html/TC.html
    certainty: https://tei-c.org/release/doc/tei-p5-doc/en/html/CE.html
  encoding:
    - Represent each point of disagreement as an `<app>` element (TEI Guidelines, Chapter 13).
    - Record the selected compiled reading as `<lem>`.
    - Record every attested reading (including the selected one) as `<rdg>` with a `wit` attribute
      listing its supporting manuscripts.
    - Declare all manuscripts in `<listWit>`.
    - Record each reading's estimated probability using `<certainty>` with `degree` in `[0, 1]` (TEI
      Guidelines, Chapter 22), and record the uncertainty interval in a `<note>` attached to the
      same reading.
    - Place the method description, full model attribution (lab, model, version, variant, effort
      level, and configuration), specification ID, and compilation ID in `<teiHeader>`.
  directory_layout: transcripts/<specification-id>/<compilation-id>/
  contents:
    - One TEI P5 XML file per compiled book.
    - A single manifest (record) file (`manifest.json`) conforming to the schema in `AGENTS.md`,
      listing all book files, full model attribution, the compilation ID, and a statement citing
      this specification's ID (`01M8G79M8NS4GF6JTVHKEMB60P`).
    - A structured Markdown compilation report (`REPORT.md`) with YAML frontmatter conforming to
      `AGENTS.md`, followed by a plain-language Markdown narrative of what was performed.
