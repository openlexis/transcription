    - when: 2020-09-07
      description: "Correction of υψιστω to υψιστου on Q70-8r-1-7, with thanks to Michael Dormandy. (version 1.05)."
      "n": "8"
    - when: 2014-03-25
      description: "Correction of erroneous encodings at Q74-2r-1-46 (rough breathing), Q69-1r-1-23 (lunate sigma), Q72-2r-2-3 (punctuation), Q17-1v-3-4 (diairesis), Q34-8r-2-28 (punctuation), Q82-4r-3-31 (punctuation). Thanks to Pietro Campagna for pointing out these and change 6 below (version 1.04)."
      "n": "7"
    - when: 2014-03-12
      description: XML adjusted for correction and missing word added on Q45-1r-3-11. (version 1.03).
      "n": "6"
    - when: 2012-05-04
      description: First chapter title on Q88-4v corrected. (version 1.03).
      "n": "5"
    - when: 2012-01-27
      description: scribeid for Q77-6r corrected to A - this should have happened at the last change but was not correct in this file. (version 1.02b).
      "n": "4"
    - when: 2010-12-15
      description: scribeid for Q77-6 to 8 corrected to A (version 1.02).
      "n": "3"
    - when: 2010-11-03
      description: Minor changes to transcription incorporated (version 1.01).
      "n": "2"
    - when: 2010-07-06
      description: Website launched at www.codexsinaiticus.org with full transcription (version 1.0)
      "n": "1"
