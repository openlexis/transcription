    - kind: independent-double-transcription
      generalPractice: true
      text: Two independent initial transcriptions are made of each manuscript.
      sources:
        - title: "The Editio Critica Maior of the Greek New Testament: twenty years of digital collaboration"
          url: https://pure-oai.bham.ac.uk/ws/files/120791797/2020_EarlyChristianity_EditioCriticaMaior.pdf
