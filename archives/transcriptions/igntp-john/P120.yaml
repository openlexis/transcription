          accessed: 2026-11-26
          quote: Both organizations observe the same practice of producing two independent initial transcriptions
    - kind: reconciliation
      generalPractice: true
      text: "A third person, usually the transcription coordinator, reconciles the two with reference to the images of the manuscript and makes the final file."
      sources:
