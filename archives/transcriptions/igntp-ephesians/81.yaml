method:
  practices:
    - kind: independent-double-transcription
      generalPractice: true
      text: Two independent initial transcriptions are made of each manuscript.
      sources:
        - title: "The Editio Critica Maior of the Greek New Testament: twenty years of digital collaboration"
          url: https://pure-oai.bham.ac.uk/ws/files/120791797/2020_EarlyChristianity_EditioCriticaMaior.pdf
          citation: "H.A.G. Houghton, D.C. Parker, P. Robinson and K. Wachtel, Early Christianity 11 (2020), 97-117, https://doi.org/10.1628/ec-2020-0009"
          accessed: 2026-11-26
          quote: Both organizations observe the same practice of producing two independent initial transcriptions
    - kind: reconciliation
      generalPractice: true
      text: "A third person, usually the transcription coordinator, reconciles the two with reference to the images of the manuscript and makes the final file."
      sources:
        - title: "The Editio Critica Maior of the Greek New Testament: twenty years of digital collaboration"
          url: https://pure-oai.bham.ac.uk/ws/files/120791797/2020_EarlyChristianity_EditioCriticaMaior.pdf
          citation: "H.A.G. Houghton, D.C. Parker, P. Robinson and K. Wachtel, Early Christianity 11 (2020), 97-117, https://doi.org/10.1628/ec-2020-0009"
          accessed: 2026-11-26
          quote: "these are reconciled by a third person (usually the transcription coordinator) with reference to the images of the manuscript, who creates a final file"
